name: gpu-standard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Hold the Node01 release slot for each main-branch run.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'huahuo-funasr-acr' || format('huahuo-funasr-ci-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  ACR_REGION: cn-beijing
  ACR_HOST: huahuoai-docker-hub-registry-vpc.cn-beijing.cr.aliyuncs.com
  OIDC_PROVIDER_ARN: acs:ram::1472289886746775:oidc-provider/github-actions
  OIDC_ROLE_ARN: acs:ram::1472289886746775:role/github-actions-release

jobs:
  validate:
    name: Validate API and image configuration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11'
      - name: Run API tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -c constraints.txt -r requirements-test.txt fastapi numpy python-multipart prometheus-client
          python -m pytest -q -p no:cacheprovider tests
      - name: Verify the pinned GPU runtime can be reused
        env:
          BASE_SOURCE: 9287472942a82f34507d1019221ee8cdd3664987
        run: |
          git diff --exit-code "$BASE_SOURCE" HEAD -- .dockerignore requirements.txt 'constraints*.txt' 'model-lock*.json' scripts/prepare_funasr.py scripts/download_models.py
          diff -u <(git show "$BASE_SOURCE:Dockerfile" | sed '/^# Validate the amd64 ASK candidate/,$d') \
            <(sed -e '/^ARG ASK_MODERN_BASE=/d' -e '/^# Validate the amd64 ASK candidate/,$d' Dockerfile)
          removed=$(git diff --name-only --no-renames --diff-filter=D "$BASE_SOURCE" HEAD -- app/ scripts/)
          if [[ -n "$removed" ]]; then
            printf 'A full GPU runtime rebuild is required to remove files inherited from the base:\n%s\n' "$removed" >&2
            exit 1
          fi
      - name: Check Docker profiles
        run: |
          docker buildx build --check --platform linux/amd64 --target production .
          docker buildx build --check --platform linux/amd64 --target ask-release --build-arg BUILD_PROFILE=a10-2gb .
          docker buildx build --check --platform linux/amd64 --target ask-release-full --build-arg BUILD_PROFILE=nvidia-modern .
          docker buildx build --check --platform linux/amd64 --target ask-release --build-arg BUILD_PROFILE=nvidia-modern --build-arg ASK_MODERN_BASE=scratch .

  publish:
    name: Build and publish ${{ matrix.release_name }} on Node01
    needs: validate
    if: >-
      github.repository == 'kyriswu/huahuo-funasr' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - release_name: gpu-standard
            gpu_profile: nvidia-modern
    permissions:
      contents: read
      id-token: write
    env:
      FUNASR_NODE01_INSTANCE_ID: i-2zeaydxol26pp3dxg1ak
      FUNASR_NODE01_PUBLISH_COMMAND_ID: c-bj0742lf7bciz28
      FUNASR_BUILD_PROFILE: ${{ matrix.gpu_profile }}
      ACR_REPOSITORY: huahuo/huahuo-funasr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5 # v1
        with:
          version: '3.5.3'
      - name: Obtain temporary Node01 release credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ env.OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 5400
          role-session-name: gha-funasr-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.gpu_profile }}
      - name: Invoke the fixed FunASR publish command
        id: node01
        run: bash .github/scripts/invoke-acr-publish.sh
      - name: Record the published image
        env:
          FUNASR_IMAGE: ${{ steps.node01.outputs.FUNASR_IMAGE }}
          FUNASR_RELEASE_NAME: ${{ matrix.release_name }}
        run: |
          printf '::notice::Published %s %s\n' "$FUNASR_RELEASE_NAME" "$FUNASR_IMAGE"
          printf '### FunASR %s\n\n`%s`\n' "$FUNASR_RELEASE_NAME" "$FUNASR_IMAGE" >> "$GITHUB_STEP_SUMMARY"
