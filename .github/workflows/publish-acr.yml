name: Publish FunASR GPU image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Hold the Node01 release slot for each main-branch run.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'huahuo-funasr-acr' || format('huahuo-funasr-ci-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  ACR_REGION: cn-beijing
  ACR_HOST: huahuoai-docker-hub-registry-vpc.cn-beijing.cr.aliyuncs.com
  OIDC_PROVIDER_ARN: acs:ram::1472289886746775:oidc-provider/github-actions
  OIDC_ROLE_ARN: acs:ram::1472289886746775:role/github-actions-release

jobs:
  validate:
    name: Validate API and image configuration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11'
      - name: Run API tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -c constraints.txt -r requirements-test.txt fastapi numpy python-multipart prometheus-client
          python -m pytest -q -p no:cacheprovider tests
      - name: Check Docker profiles
        run: |
          docker buildx build --check --platform linux/amd64 .
          docker buildx build --check --platform linux/amd64 --build-arg BUILD_PROFILE=a10-2gb .
          docker buildx build --check --platform linux/amd64 --build-arg BUILD_PROFILE=nvidia-modern .

  publish:
    name: Build and publish on Node01 (${{ matrix.gpu_profile }})
    needs: validate
    if: >-
      github.repository == 'kyriswu/huahuo-funasr' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        gpu_profile: [nvidia-modern]
    permissions:
      contents: read
      id-token: write
    env:
      FUNASR_NODE01_INSTANCE_ID: i-2zeaydxol26pp3dxg1ak
      FUNASR_NODE01_PUBLISH_COMMAND_ID: c-bj0742lf7bciz28
      FUNASR_BUILD_PROFILE: ${{ matrix.gpu_profile }}
      ACR_REPOSITORY: huahuo/huahuo-funasr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5 # v1
        with:
          version: '3.5.3'
      - name: Obtain temporary Node01 release credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ env.OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 5400
          role-session-name: gha-funasr-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.gpu_profile }}
      - name: Read the results of previous Node01 executions
        env:
          FAILED_RUNS: 't-bj0746a1higycjk t-bj0746dipvzzmyo'
        run: |
          set -euo pipefail
          for invocation in $FAILED_RUNS; do
            diagnostic=$(timeout 30s aliyun ecs DescribeInvocationResults --region "$ACR_REGION" --RegionId "$ACR_REGION" \
              --CommandId "$FUNASR_NODE01_PUBLISH_COMMAND_ID" --InstanceId "$FUNASR_NODE01_INSTANCE_ID" \
              --InvokeId "$invocation" --ContentEncoding PlainText --MaxResults 1 --retry-count 0 --yes |
              jq -ce --arg id "$invocation" --arg instance "$FUNASR_NODE01_INSTANCE_ID" --arg command "$FUNASR_NODE01_PUBLISH_COMMAND_ID" '
                .Invocation.InvocationResults.InvocationResult
                | map(select(.InvokeId == $id and .InstanceId == $instance and .CommandId == $command))
                | select(length == 1) | first
                | ((.Output // "") + "\n" + (.ErrorInfo // "")) as $log
                | {
                    invocation: $id,
                    status: (.InvocationStatus | select(test("^[A-Za-z]+$"))),
                    exit_code: (.ExitCode | if type == "number" then . else null end),
                    dropped: (.Dropped // 0 | numbers),
                    output_length: ($log | length),
                    signals: [
                      {name: "disk_full", pattern: "no space left|ENOSPC|disk quota exceeded"},
                      {name: "out_of_memory", pattern: "out of memory|cannot allocate memory|killed|exit code: 137"},
                      {name: "registry_auth", pattern: "unauthorized|authorization failed|insufficient.scope|401 unauthorized|403 forbidden"},
                      {name: "network_timeout", pattern: "timed out|timeout|connection reset|unexpected EOF|TLS handshake"},
                      {name: "network_dns", pattern: "no such host|temporary failure in name resolution|could not resolve|name or service not known"},
                      {name: "dependency_install", pattern: "could not install|pip install|no matching distribution|no versions found"},
                      {name: "model_download", pattern: "download_models[.]py|modelscope|weights|checksum"},
                      {name: "model_check", pattern: "verify_models|unexpected inference defaults|lacks GPU kernels|unexpected CUDA runtime|Traceback"},
                      {name: "image_export", pattern: "exporting layers|pushing layers|pushing manifest|exporter"},
                      {name: "manifest_read", pattern: "manifest unknown|canonical image digest|imagetools"},
                      {name: "source_tip_moved", pattern: "no longer the tip|could not verify FunASR main"},
                      {name: "builder_lock", pattern: "another FunASR release is running"},
                      {name: "command_timeout", pattern: "deadline exceeded|Terminated"},
                      {name: "emulation_failure", pattern: "exec format error|Illegal instruction|qemu|segmentation fault"},
                      {name: "registry_token", pattern: "GetAuthorizationToken|security.credentials|docker login"},
                      {name: "download_retry", pattern: "retrying|Failed to resume|incomplete download"}
                    ] | map(select(.pattern as $pattern | $log | test($pattern; "i")) | .name)
                  }')
            printf '::notice::Node01 diagnostic %s\n' "$diagnostic"
          done
