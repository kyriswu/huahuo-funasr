services:
  funasr:
    image: funasr-eci:gpu
    build:
      context: .
      target: production
    gpus: all
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEVICE: cuda:0
      API_TOKEN: ${API_TOKEN:-}
      BATCH_SIZE_S: ${BATCH_SIZE_S:-120}
      CPU_THREADS: "4"
      VOICEPRINT_THRESHOLD: ${VOICEPRINT_THRESHOLD:-0.5}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-21600}
      DECODE_TIMEOUT_SECONDS: ${DECODE_TIMEOUT_SECONDS:-120}
      MAX_PENDING_TASKS: ${MAX_PENDING_TASKS:-16}
      MAX_TASK_AUDIO_MB: ${MAX_TASK_AUDIO_MB:-1024}
      MAX_TASK_RESULT_MB: ${MAX_TASK_RESULT_MB:-16}
      CALLBACK_SECRET: ${CALLBACK_SECRET:-}
      CALLBACK_ALLOWED_ORIGINS: ${CALLBACK_ALLOWED_ORIGINS:-}
      CALLBACK_TIMEOUT_SECONDS: ${CALLBACK_TIMEOUT_SECONDS:-10}
      CALLBACK_MAX_ATTEMPTS: ${CALLBACK_MAX_ATTEMPTS:-10}
    volumes:
      - voiceprints:/data
    restart: unless-stopped
    stop_grace_period: 10m

volumes:
  voiceprints:
